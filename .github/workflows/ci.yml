name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill files and zips match
        run: |
          python3 - << 'PY'
          import zipfile
          from pathlib import Path

          def load(name):
              text = Path(f"skills/{name}/SKILL.md").read_text()
              assert text.startswith("---\n")
              head = text.split("---", 2)[1]
              assert f"name: {name}" in head
              return text

          writer = load("writer")
          checker = load("checker")
          script = Path("skills/checker/scripts/check.py").read_bytes()
          zw = zipfile.ZipFile("packaged/writer.skill")
          zc = zipfile.ZipFile("packaged/checker.skill")
          assert zw.namelist() == ["writer/SKILL.md"]
          assert zw.read("writer/SKILL.md").decode() == writer
          assert zc.namelist() == ["checker/SKILL.md", "checker/scripts/check.py"]
          assert zc.read("checker/SKILL.md").decode() == checker
          assert zc.read("checker/scripts/check.py") == script
          print("ok")
          PY
      - name: install.sh into an empty directory
        run: |
          dest=$(mktemp -d)
          CLAUDE_SKILLS_DIR="$dest" ./install.sh
          test -f "$dest/writer/SKILL.md"
          test -f "$dest/checker/SKILL.md"
          test -x "$dest/checker/scripts/check.py" || test -f "$dest/checker/scripts/check.py"
          grep -q "name: writer" "$dest/writer/SKILL.md"
          grep -q "name: checker" "$dest/checker/SKILL.md"
      - name: demo matches the transcript
        run: |
          python3 scripts/demo.py > /tmp/demo.out
          diff -u docs/demo-transcript.txt /tmp/demo.out
          python3 - << 'PY'
          from pathlib import Path
          out = Path("docs/demo-transcript.txt").read_text().strip()
          readme = Path("README.md").read_text()
          if out not in readme:
              raise SystemExit("README does not contain the demo transcript")
          print("demo matches readme")
          PY
